<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog (API-loaded)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Product Catalog</h1>
    <p>Data is loaded on demand from the API</p>
  </header>

  <main>
    <section class="section">
      <div class="section-header">
        <h2>Promotions</h2>
      </div>
      <div id="promo-status" class="status"></div>
      <div id="promo-list" class="promo-list"></div>
    </section>

    <section class="section">
      <div class="section-header">
        <h2>Products</h2>
      </div>
      <div id="product-status" class="status"></div>
      <div id="product-list" class="product-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Product Catalog Demo</p>
  </footer>

  <script src="api.js"></script>
  <script src="script.js"></script>
</body>
</html>
