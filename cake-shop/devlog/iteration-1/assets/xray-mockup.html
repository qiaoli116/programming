<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cake Order Desk – x-ray view mockup</title>
<style>
  :root {
    --bg:#f5f6f8; --card:#fff; --text:#1d2330; --muted:#5d6677; --line:#d5dae2;
    --web:#0f766e; --api:#64748b; --ai:#b8860b; --data:#2b5fb8; --rules:#475569; --ok:#15803d; --bad:#b42318;
    --glow:#f59e0b; --human:#7e22ce;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#12151c; --card:#1a1f2a; --text:#e6e9ef; --muted:#9aa3b5; --line:#2f3747;
      --web:#4fd1c5; --api:#94a3b8; --ai:#e0b341; --data:#7aa7f0; --rules:#94a3b8; --ok:#4ade80; --bad:#f08a80;
      --glow:#fbbf24; --human:#c084fc;
    }
  }
  * { box-sizing:border-box; }
  /* The x-ray window: show only. Nothing in it can be clicked, typed into or scrolled by hand. */
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
         display:grid; grid-template-rows:auto auto minmax(0,1fr); grid-template-columns:minmax(0,1fr); gap:10px; padding:10px 14px 14px; overflow:hidden;
         user-select:none; cursor:default; }
  header { display:flex; align-items:center; gap:14px; }
  header b { font-size:1.05rem; }
  .status { margin-left:auto; display:flex; align-items:center; gap:8px; color:var(--muted); font-size:.9rem; }
  .status i { width:9px; height:9px; border-radius:50%; background:var(--ok); }
  .status.off i { background:var(--glow); }
  .stage { color:var(--muted); font-size:.9rem; }
  .pane { background:var(--card); border:1px solid var(--line); border-radius:10px; min-height:0; display:flex; flex-direction:column; }
  .pane h2 { margin:0; padding:8px 14px; font-size:.75rem; letter-spacing:.08em; color:var(--muted); border-bottom:1px solid var(--line); }

  /* map */
  svg { display:block; width:100%; height:auto; max-height:52vh; }
  .edge { stroke:var(--line); stroke-width:2; fill:none; transition:stroke .3s; }
  .edge.on { stroke:var(--glow); }
  .node .shape { fill:var(--card); stroke-width:2; rx:10; transition:filter .3s, stroke-width .3s; }
  .frame { fill:none; stroke:var(--line); stroke-width:1.5; stroke-dasharray:4 4; }
  .fl { fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.07em; }
  .c-human .shape { stroke:var(--human); }
  .node text { fill:var(--text); font-size:14px; font-weight:600; text-anchor:middle; dominant-baseline:middle; }
  .node .st { fill:var(--muted); font-size:11.5px; font-weight:400; }
  .node.busy .shape { stroke-width:3.5; filter:drop-shadow(0 0 6px var(--glow)); animation:pulse 1s ease-in-out infinite; }
  .node.ok .shape { stroke:var(--ok) !important; stroke-width:3.5; }
  .node.bad .shape { stroke:var(--bad) !important; stroke-width:3.5; }
  @keyframes pulse { 50% { filter:drop-shadow(0 0 1px var(--glow)); } }
  .c-web .shape { stroke:var(--web); } .c-api .shape { stroke:var(--api); } .c-ai .shape { stroke:var(--ai); stroke-dasharray:6 4; }
  .c-data .shape { stroke:var(--data); } .c-rules .shape { stroke:var(--rules); }
  .dot { fill:var(--glow); }

  /* console */
  .console { flex:1; min-height:0; overflow:hidden; font:12.5px/1.6 ui-monospace,Consolas,monospace; padding:6px 0;
             display:flex; flex-direction:column; justify-content:flex-end; }
  .ln { padding:0 14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:none; }
  .ln .t { color:var(--muted); }
  .ln .p { display:inline-block; width:78px; font-weight:700; }
  .ln .ms { color:var(--muted); float:right; }
  .ln.new { animation:flash 1.2s; }
  @keyframes flash { from { background:color-mix(in srgb, var(--glow) 25%, transparent); } }
  .p-human { color:var(--human); } .p-web { color:var(--web); } .p-api { color:var(--api); } .p-ai { color:var(--ai); } .p-data { color:var(--data); } .p-rules { color:var(--rules); }
  /* a line's data, shown under it at once (there is no clicking to open it) */
  .data { padding:0 14px 0 calc(14px + 26ch); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:none; }
  .sep { padding:4px 14px; color:var(--muted); flex:none; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
</style>
</head>
<body>
<!-- Mockup of the x-ray child window, for devlog 07: a scripted replay of "actually it's only 10 people" that loops.
     In the app the studio opens this window and feeds it the server's live trace. -->
<header>
  <b>X-ray · C-1046</b><span class="stage" id="state"></span>
  <span class="status" id="link"><i></i><span>Connected to the studio</span></span>
</header>
<div class="pane">
  <h2>MAP</h2>
  <svg id="map" viewBox="0 0 1150 470"></svg>
</div>
<div class="pane">
  <h2>CONSOLE</h2>
  <div class="console" id="console"></div>
</div>

<script>
// ---- layout: name, colour class, centre --------------------------------------------------------------------------
const NODES = {
  user:     { name: 'User',         c: 'human', x: 70,   y: 180 },
  studio:   { name: 'Studio',       c: 'web',   x: 230,  y: 180 },
  api:      { name: 'API',          c: 'api',   x: 400,  y: 180 },
  host:     { name: 'Host',         c: 'ai',    x: 570,  y: 70 },
  board:    { name: 'Job board',    c: 'data',  x: 570,  y: 180 },
  designer: { name: 'Designer',     c: 'ai',    x: 570,  y: 290 },
  tools:    { name: 'Tools',        c: 'rules', x: 730,  y: 290 },
  checker:  { name: 'Checker',      c: 'rules', x: 880,  y: 290 },
  llm:      { name: 'LLM (Claude)', c: 'ai',    x: 1060, y: 180 },
  db:       { name: 'DB (SQLite)',  c: 'data',  x: 400,  y: 420, db: true },
};
// Frames: where each part runs.
const FRAMES = [
  { label: 'BROWSER', x: 160, y: 120, w: 140, h: 120 },
  { label: 'BACKEND (Node server)', x: 330, y: 18, w: 625, h: 330 },
  { label: 'ANTHROPIC API', x: 985, y: 120, w: 150, h: 120 },
];
const EDGES = [['user','studio'],['studio','api'],['api','host'],['api','db'],['host','board'],['host','llm'],['board','designer'],
               ['designer','llm'],['designer','tools'],['tools','checker'],['designer','db']];
const W = 112, H = 44;

const svg = document.getElementById('map');
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const key = (a, b) => [a, b].sort().join('-');
for (const f of FRAMES) {
  el('rect', { class: 'frame', x: f.x, y: f.y, width: f.w, height: f.h, rx: 12 });
  el('text', { class: 'fl', x: f.x + 10, y: f.y + 16 }).textContent = f.label;
}
const edgeEl = {};
for (const [a, b] of EDGES) edgeEl[key(a, b)] = el('line', { class: 'edge', x1: NODES[a].x, y1: NODES[a].y, x2: NODES[b].x, y2: NODES[b].y });
const dotLayer = el('g', {});
const nodeEl = {}, statusEl = {};
for (const id in NODES) {
  const n = NODES[id];
  const g = el('g', { class: `node c-${n.c}` });
  if (n.db) {
    // a cylinder: the usual sign for a database
    const x = n.x - W / 2, y = n.y - H / 2, ry = 7;
    el('path', { class: 'shape', d: `M${x},${y + ry} v${H - ry * 2} a${W / 2},${ry} 0 0 0 ${W},0 v${-(H - ry * 2)} a${W / 2},${ry} 0 0 0 ${-W},0 a${W / 2},${ry} 0 0 0 ${W},0` }, g);
  } else el('rect', { class: 'shape', x: n.x - W / 2, y: n.y - H / 2, width: W, height: H }, g);
  el('text', { x: n.x, y: n.y }, g).textContent = n.name;
  statusEl[id] = el('text', { class: 'st', x: n.x, y: n.y + H / 2 + 14 }, g);
  nodeEl[id] = g;
}
svg.appendChild(dotLayer); // dots above edges, under nothing: they run between the boxes

// ---- effects ------------------------------------------------------------------------------------------------------
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function send(from, to, ms = 450) {
  const a = NODES[from], b = NODES[to], line = edgeEl[key(from, to)];
  line.classList.add('on');
  const dot = el('circle', { class: 'dot', r: 6, cx: a.x, cy: a.y }, dotLayer);
  const t0 = performance.now();
  return new Promise((done) => {
    const tick = (now) => {
      const k = Math.min(1, (now - t0) / ms);
      dot.setAttribute('cx', a.x + (b.x - a.x) * k);
      dot.setAttribute('cy', a.y + (b.y - a.y) * k);
      if (k < 1) requestAnimationFrame(tick);
      else { dot.remove(); setTimeout(() => line.classList.remove('on'), 250); done(); }
    };
    requestAnimationFrame(tick);
  });
}
const timers = {};
function busy(id, label) {
  nodeEl[id].classList.add('busy');
  const t0 = performance.now();
  clearInterval(timers[id]);
  timers[id] = setInterval(() => (statusEl[id].textContent = `${label} ${((performance.now() - t0) / 1000).toFixed(1)}s`), 100);
}
function idle(id, text = '') {
  nodeEl[id].classList.remove('busy');
  clearInterval(timers[id]);
  statusEl[id].textContent = text;
}
function flash(id, cls) {
  nodeEl[id].classList.add(cls);
  setTimeout(() => nodeEl[id].classList.remove(cls), 700);
}

// ---- console ------------------------------------------------------------------------------------------------------
const box = document.getElementById('console');
const PART = { user: 'human', studio: 'web', api: 'api', host: 'ai', designer: 'ai', llm: 'ai', board: 'data', db: 'data', tools: 'rules', checker: 'rules' };
let clock0 = 0;
function log(part, text, data, ms) {
  const t = new Date(Date.UTC(2026, 10, 13, 12, 4, 1) + (performance.now() - clock0)).toISOString().slice(11, 23);
  const ln = document.createElement('div');
  ln.className = 'ln new';
  ln.innerHTML = `<span class="t">${t}</span>  <span class="p p-${PART[part]}">${part}</span>${text}${ms ? `<span class="ms">${ms} ms</span>` : ''}`;
  box.appendChild(ln);
  if (data) { const d = document.createElement('div'); d.className = 'data'; d.textContent = JSON.stringify(data); box.appendChild(d); }
  // the newest lines sit at the bottom; old ones drop off the top (no scrolling by hand)
  while (box.children.length > 200) box.firstElementChild.remove();
}

// ---- the script: "actually it's only 10 people" -------------------------------------------------------------------
async function modelStep(agent, model, ms, out, data) {
  await send(agent, 'llm');
  log(agent, `step → ${model}`);
  busy('llm', 'thinking');
  await sleep(ms);
  idle('llm');
  await send('llm', agent);
  log('llm', `← ${out}`, data, ms);
}
async function tool(name, input, change) {
  await send('designer', 'tools');
  log('tools', `${name} ${JSON.stringify(input)}`, { input });
  await send('tools', 'checker', 300);
  flash('checker', 'ok');
  log('checker', `<span class="ok">✓ ok</span>  price recalculated`, { ok: true, reasons: [], quote: { total: 52 } });
  await send('tools', 'designer', 300);
  await send('designer', 'board', 300);
  log('board', `job 3 progress: ${change}`);
}

async function play() {
  clock0 = performance.now();
  const say = (s) => (document.getElementById('state').textContent = s);

  say('The host answers…');
  await send('user', 'studio');
  log('user', `sends "actually it's only 10 people"`);
  await send('studio', 'api');
  log('studio', 'POST /orders/C-1046/messages', { text: "actually it's only 10 people" });
  busy('api', 'request');
  await send('api', 'db', 300);
  log('db', 'saved  chat +1');
  await send('api', 'host');
  busy('host', 'turn');
  log('host', 'message(C-1046)');
  await modelStep('host', 'claude-haiku-5-5', 1600, 'ask_designer, reply', {
    in_tokens: 1240, out_tokens: 92,
    calls: [
      { name: 'ask_designer', input: { task: 'The customer now has 10 guests. Update the guests and re-fit the size.' } },
      { name: 'reply', input: { text: "On it, I've asked our designer to resize it for 10." } },
    ],
  });
  await send('host', 'board');
  log('board', 'job 3 queued', { task: 'The customer now has 10 guests. Update the guests and re-fit the size.' });
  idle('host');
  await send('api', 'db', 300);
  log('db', 'saved  chat +2 (reply, handoff) · jobs');
  idle('api');
  await send('api', 'studio');
  log('api', '200  busy: true', null, 1890);

  say('The designer works…');
  await send('board', 'designer');
  busy('designer', 'job 3');
  log('board', 'job 3 working');
  await modelStep('designer', 'claude-sonnet-5-5', 1900, 'set_brief', { in_tokens: 3410, out_tokens: 64, calls: [{ name: 'set_brief', input: { field: 'guests', value: 10 } }] });
  await tool('set_brief', { field: 'guests', value: 10 }, 'set guests 20 → 10');
  await send('studio', 'api', 300);
  log('studio', 'GET /orders/C-1046 (poll)  busy: true');
  await modelStep('designer', 'claude-sonnet-5-5', 1500, 'set_design', { in_tokens: 3720, out_tokens: 58, calls: [{ name: 'set_design', input: { field: 'size', value: '8in' } }] });
  await tool('set_design', { field: 'size', value: '8in' }, 'set size 10in → 8in');
  await modelStep('designer', 'claude-sonnet-5-5', 1200, 'report', { calls: [{ name: 'report', input: { summary: 'Guests are now 10 and the cake is 8 inches, which serves 16.' } }] });
  await send('designer', 'db');
  log('db', 'saved  brief.guests 20→10 · design.size 10in→8in · quote · chat +2 · jobs', {
    brief: { guests: [20, 10] }, design: { size: ['10in', '8in'] }, quote: { total: [68, 52] }, undoGroup: 'g41',
  });
  await send('designer', 'board');
  log('board', 'job 3 reporting', { summary: 'Guests are now 10 and the cake is 8 inches, which serves 16.', changes: ['guests 20 → 10', 'size 10in → 8in'] });
  idle('designer');

  say('The host reports back…');
  await send('board', 'host');
  busy('host', 'report');
  await modelStep('host', 'claude-haiku-5-5', 1300, 'reply', { calls: [{ name: 'reply', input: { text: "Done: it's now an 8-inch cake for 10." } }] });
  await send('host', 'board');
  log('board', 'job 3 done');
  idle('host');
  await send('studio', 'api', 300);
  log('studio', 'GET /orders/C-1046 (poll)  busy: false → panel unpaused');
  await send('studio', 'user');
  log('user', `sees "Done: it's now an 8-inch cake for 10." and the new cake`);

  say('Waiting for the next message…');
}
// The mockup loops on its own. To show what the window does when the studio reloads, each round ends with a short
// "lost the studio" moment before it connects again.
async function loop() {
  const link = document.getElementById('link');
  for (;;) {
    await play();
    await sleep(3000);
    link.classList.add('off'); link.lastElementChild.textContent = 'Studio reloading, connecting again…';
    await sleep(1500);
    link.classList.remove('off'); link.lastElementChild.textContent = 'Connected to the studio';
    const s = document.createElement('div'); s.className = 'sep'; s.textContent = '── again ──'; box.appendChild(s);
  }
}
loop();
</script>
</body>
</html>
