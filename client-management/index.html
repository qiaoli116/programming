<!DOCTYPE html>
<html>
<head>
    <title>Client management</title>
</head>
<body>

<h1 id="page-title"></h1>
<h2 id="page-subtitle"></h2>

<p id="page-description"></p>

<p><strong>The CRUD interface is done — you need to code the JavaScript.</strong></p>



<!-- ==================== CREATE / UPDATE FORM ====================
     TODO (student): wire this form up in main.js
       - On submit, read the field values below.
       - If #client-id is empty, create a new Client and add it to the list (Create).
       - If #client-id has a value, find that client and update its fields (Update).
       - Call displayClientTable(clients) again to refresh the table.
       - Reset the form (and clear #client-id) when done.
       - #btn-cancel should reset the form back to "Add" mode.
============================================================== -->
<h2>Add / Edit Client</h2>
<form id="client-form">
    <input type="hidden" id="client-id" value="">

    <label for="first-name">First Name</label>
    <input type="text" id="first-name" required>

    <label for="last-name">Last Name</label>
    <input type="text" id="last-name" required>

    <label for="email">Email</label>
    <input type="email" id="email" required>

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" required>

    <button type="submit" id="btn-save">Save Client</button>
    <button type="button" id="btn-cancel">Cancel</button>
</form>




<!-- ==================== READ / DELETE TABLE ====================
     TODO (student):
       - displayClientTable(clients) should render one row per client.
       - Each row's Actions cell should have an "Edit" and a "Delete" button
         (e.g. <button class="btn-edit" data-id="...">Edit</button>).
       - Edit should populate the form above with that client's data
         (and set #client-id so submit knows to Update instead of Create).
       - Delete should remove the client from the list and re-render the table.
============================================================== -->
<table border="1">
    <thead>
        <tr>
            <th>Client ID</th>
            <th>Client Name</th>
            <th>Client Email</th>
            <th>Client Phone</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="client-table-body">
        <!-- Client rows will be populated by JavaScript -->


    </tbody>
</table>

</body>
</html>
