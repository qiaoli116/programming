<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match-scoring agent architecture</title>
<style>
  :root { --bg:#f4f7f7; --card:#fff; --text:#1b2a2a; --muted:#5b6b6b; --line:#98aaaa; --accent:#0f766e; --soft:#e0f2f0; --warn:#fdf3dc; --warnline:#c9a227; --ok:#e3f5ea; --bad:#fde8e6; --badline:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141b1b; --card:#1d2727; --text:#e6efef; --muted:#9db0b0; --line:#5d7070; --accent:#4fd1c5; --soft:#173a37; --warn:#3a3114; --warnline:#b8932a; --ok:#14351f; --bad:#3d1b18; --badline:#f08a80; } }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,"Segoe UI",sans-serif; }
  main { max-width:1240px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:1.4rem; margin:0 0 4px; } p { margin:0 0 10px; color:var(--muted); }
  svg { width:100%; height:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  text { fill:var(--text); font-family:system-ui,"Segoe UI",sans-serif; }
  .box { fill:var(--card); stroke:var(--text); stroke-width:2.2; }
  .agent { fill:var(--soft); stroke:var(--accent); stroke-width:3; }
  .step { fill:var(--card); stroke:var(--text); stroke-width:1.8; }
  .dec { fill:var(--card); stroke:var(--text); stroke-width:1.8; }
  .okb { fill:var(--ok); stroke:var(--text); stroke-width:1.8; }
  .badb { fill:var(--bad); stroke:var(--badline); stroke-width:1.8; }
  .bar { fill:var(--text); }
  .llm { fill:var(--warn); stroke:var(--warnline); stroke-width:3; stroke-dasharray:9 5; }
  .note { fill:var(--warn); stroke:var(--warnline); stroke-width:1.5; }
  .lane { fill:none; stroke:var(--line); stroke-width:1.5; stroke-dasharray:3 5; }
  .ln { stroke:var(--text); stroke-width:2; fill:none; marker-end:url(#a); }
  .t { font-size:14px; } .s { font-size:12.5px; fill:var(--text); } .b { font-weight:700; } .h { font-size:19px; font-weight:700; }
  .yn { font-size:12.5px; font-weight:700; fill:var(--accent); }
  .n { font-weight:800; fill:var(--accent); }
</style>
</head>
<body>
<main>
<h1>Match-scoring agent: how it works</h1>
<p>Our "agent" is ordinary server code that calls the stateless LLM on the seeker's behalf. It is drawn as a flowchart: the thick bars are where the flow <b>splits into parallel lanes</b> (one lane per job) and where it <b>waits for all lanes to finish</b>.</p>

<svg viewBox="0 0 1270 900" role="img" aria-label="Flowchart of the match-scoring agent with parallel lanes, one per job">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>

  <!-- Seeker -->
  <rect class="box" x="20" y="330" width="170" height="150" rx="10"/>
  <text class="h" x="105" y="362" text-anchor="middle">Seeker</text>
  <text class="t" x="105" y="384" text-anchor="middle">web app (browser)</text>
  <text class="s" x="105" y="412" text-anchor="middle">clicks "Score these</text>
  <text class="s" x="105" y="430" text-anchor="middle">results"; never sees</text>
  <text class="s" x="105" y="448" text-anchor="middle">the API key</text>

  <!-- Agent container -->
  <text class="h" x="230" y="30">Our agent (Node server, TypeScript)</text>
  <rect class="agent" x="230" y="42" width="730" height="838" rx="12"/>

  <!-- 1 Load -->
  <rect class="step" x="500" y="62" width="200" height="56" rx="6"/>
  <text class="t b" x="600" y="86" text-anchor="middle"><tspan class="n">1</tspan> Load profile + jobs</text>
  <text class="s" x="600" y="104" text-anchor="middle">from the database</text>

  <!-- decision -->
  <path class="dec" d="M600 150 L690 188 L600 226 L510 188 Z"/>
  <text class="t b" x="600" y="192" text-anchor="middle">Profile empty?</text>
  <rect class="badb" x="740" y="164" width="170" height="48" rx="6"/>
  <text class="s" x="825" y="183" text-anchor="middle">Stop: ask seeker to fill</text>
  <text class="s" x="825" y="201" text-anchor="middle">the profile first (UC-14)</text>
  <path class="ln" d="M690 188 L738 188"/><text class="yn" x="700" y="180">yes</text>
  <path class="ln" d="M600 118 L600 148"/>
  <path class="ln" d="M600 226 L600 262"/><text class="yn" x="608" y="246">no</text>

  <!-- FORK -->
  <rect class="bar" x="270" y="262" width="620" height="10" rx="3"/>
  <text class="t b" x="270" y="256"><tspan class="n">2</tspan> FORK: one lane per job</text>

  <!-- lanes -->
  <rect class="lane" x="260" y="282" width="200" height="540" rx="8"/>
  <rect class="lane" x="500" y="282" width="200" height="540" rx="8"/>
  <rect class="lane" x="740" y="282" width="200" height="540" rx="8"/>
  <text class="t b" x="270" y="302">Lane: job 1</text>
  <text class="t b" x="510" y="302">Lane: job 2</text>
  <text class="t b" x="750" y="302">Lane: job N</text>
  <path class="ln" d="M360 272 L360 322"/><path class="ln" d="M600 272 L600 322"/><path class="ln" d="M840 272 L840 322"/>

  <!-- lane contents, generated by repeating three times -->
  <g id="laneA">
    <rect class="step" x="270" y="322" width="180" height="62" rx="6"/>
    <text class="t b" x="360" y="346" text-anchor="middle"><tspan class="n">3</tspan> Build prompt</text>
    <text class="s" x="360" y="364" text-anchor="middle">instructions + posting</text>
    <text class="s" x="360" y="378" text-anchor="middle">+ profile + answer shape</text>
    <path class="ln" d="M360 384 L360 424"/>
    <text class="s" x="368" y="408">LLM call (API)</text>
    <path class="ln" d="M360 480 L360 520"/>
    <text class="s" x="368" y="504">output text</text>
    <rect class="step" x="270" y="520" width="180" height="62" rx="6"/>
    <text class="t b" x="360" y="544" text-anchor="middle"><tspan class="n">5</tspan> Check answer</text>
    <text class="s" x="360" y="562" text-anchor="middle">stop reason ok? ≤ 5 criteria?</text>
    <text class="s" x="360" y="576" text-anchor="middle">valid levels? reasons?</text>
    <path class="ln" d="M360 582 L360 604"/>
    <path class="dec" d="M360 604 L430 636 L360 668 L290 636 Z"/>
    <text class="t b" x="360" y="641" text-anchor="middle">Valid?</text>
    <rect class="badb" x="268" y="704" width="88" height="48" rx="6"/>
    <text class="s" x="312" y="725" text-anchor="middle">Not scored</text>
    <text class="s" x="312" y="741" text-anchor="middle">(UC-14)</text>
    <rect class="okb" x="364" y="704" width="88" height="48" rx="6"/>
    <text class="s" x="408" y="722" text-anchor="middle">Overall =</text>
    <text class="s" x="408" y="738" text-anchor="middle">average</text>
    <path class="ln" d="M290 636 L312 636 L312 702"/><text class="yn" x="272" y="628">no</text>
    <path class="ln" d="M430 636 L408 636 L408 702"/><text class="yn" x="432" y="628">yes</text>
    <path class="ln" d="M312 752 L312 790"/><path class="ln" d="M408 752 L408 774 L360 774 L360 790"/>
  </g>
  <use href="#laneA" x="240"/>
  <use href="#laneA" x="480"/>

  <!-- LLM band (external) -->
  <rect class="llm" x="260" y="424" width="680" height="56" rx="8"/>
  <text class="t b" x="600" y="448" text-anchor="middle"><tspan class="n">4</tspan> LLM brain · Claude Haiku 5.5 · Anthropic servers (outside our code)</text>
  <text class="s" x="600" y="467" text-anchor="middle">stateless: three separate calls running side by side, none knows about the others</text>

  <!-- JOIN -->
  <rect class="bar" x="270" y="790" width="620" height="10" rx="3"/>
    <text class="t b" x="270" y="816"><tspan class="n">6</tspan> JOIN: wait until every lane is finished</text>
  <path class="ln" d="M600 800 L600 826"/>

  <!-- 7 Assemble -->
  <rect class="step" x="470" y="826" width="260" height="42" rx="6"/>
  <text class="t b" x="600" y="845" text-anchor="middle"><tspan class="n">7</tspan> Assemble reply</text>
  <text class="s" x="600" y="861" text-anchor="middle">per job: score + criteria, or "Not scored"</text>

  <!-- seeker arrows -->
  <path class="ln" d="M190 350 L220 350 L220 90 L498 90"/>
  <text class="n" x="196" y="338">0</text>
  <text class="s" x="140" y="318" text-anchor="middle">job ids</text>
  <path class="ln" d="M470 847 L105 847 L105 482"/>
  <text class="s" x="112" y="700">scores</text>

  <g transform="translate(30,0)">
  <!-- legend -->
  <rect class="note" x="960" y="42" width="260" height="240" rx="8"/>
  <text class="t b" x="975" y="66">How to read the chart</text>
  <rect class="step" x="975" y="80" width="46" height="24" rx="4"/><text class="s" x="1032" y="97">a step our code does</text>
  <path class="dec" d="M998 114 L1021 128 L998 142 L975 128 Z"/><text class="s" x="1032" y="132">a yes / no decision</text>
  <rect class="bar" x="975" y="156" width="46" height="9" rx="3"/><text class="s" x="1032" y="166">FORK / JOIN: parallel</text>
  <text class="s" x="1032" y="181">lanes start / all must finish</text>
  <rect class="llm" x="975" y="196" width="46" height="24" rx="4"/><text class="s" x="1032" y="213">a call outside our code</text>
  <rect class="lane" x="975" y="232" width="46" height="30" rx="4"/><text class="s" x="1032" y="251">one parallel lane</text>

  <!-- notes -->
  <rect class="note" x="960" y="300" width="260" height="150" rx="8"/>
  <text class="t b" x="975" y="324">Why lanes?</text>
  <text class="s" x="975" y="346">Each job is scored by its own</text>
  <text class="s" x="975" y="364">call, so they can run at once</text>
  <text class="s" x="975" y="382">(faster) and one failure only</text>
  <text class="s" x="975" y="400">affects its own card. The LLM is</text>
  <text class="s" x="975" y="418">stateless, so every call carries</text>
  <text class="s" x="975" y="436">everything it needs.</text>

  <rect class="note" x="960" y="468" width="260" height="170" rx="8"/>
  <text class="t b" x="975" y="492">How "agent" is this?</text>
  <text class="s" x="975" y="514">The steps are fixed by us. The</text>
  <text class="s" x="975" y="532">LLM never decides what happens</text>
  <text class="s" x="975" y="550">next, and there is no tool loop.</text>
  <text class="s" x="975" y="574">A loop (LLM asks for a tool, we</text>
  <text class="s" x="975" y="592">run it, call again with the result)</text>
  <text class="s" x="975" y="610">would be a later extension.</text>

  <rect class="note" x="960" y="656" width="260" height="130" rx="8"/>
  <text class="t b" x="975" y="680">Our code, not the LLM</text>
  <text class="s" x="975" y="702">checks every answer and computes</text>
  <text class="s" x="975" y="720">the overall score (Meets 1, Partly</text>
  <text class="s" x="975" y="738">0.5, Does not meet 0, Unknown</text>
  <text class="s" x="975" y="756">ignored). The API key stays in</text>
  <text class="s" x="975" y="774">app/.env on the server.</text>
  </g>
</svg>
</main>
</body>
</html>
